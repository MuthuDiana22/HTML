<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDEI - Report</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🔒 PDEI System</div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/register-case">Register Case</a>
            <a href="/upload-evidence">Upload Evidence</a>
            <a href="/report" class="active">Report</a>
            <a href="/verify-integrity">Verify Integrity</a>
            <a href="/" class="btn-logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h2>📑 Case Report & History</h2>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchCaseId" placeholder="Enter Case ID (e.g., CASE-0001)">
                <button onclick="searchCase()" class="btn btn-primary">🔍 Search</button>
                <button onclick="showAllCases()" class="btn btn-secondary">📋 Show All</button>
            </div>
        </div>
        
        <div id="reportResult">
            <div class="info-box">
                <p>🔍 Enter a Case ID to view details or click "Show All" to see all cases.</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
